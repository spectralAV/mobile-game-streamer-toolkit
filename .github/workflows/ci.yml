name: CI

on:
  workflow_dispatch:
  pull_request:
  push:
    branches:
      - master
      - main

permissions:
  contents: read

jobs:
  build-and-test:
    name: Build & Test (Windows x64)
    runs-on: windows-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Validate PowerShell scripts syntax
        shell: pwsh
        run: |
          $scripts = @(Get-ChildItem -Path "scripts\*.ps1", "installer\*.ps1" -ErrorAction Stop)
          foreach ($file in $scripts) {
            $errors = $null
            $tokens = $null
            [void][System.Management.Automation.Language.Parser]::ParseFile($file.FullName, [ref]$tokens, [ref]$errors)
            if ($errors.Count -gt 0) {
              throw "PowerShell syntax error in $($file.FullName): $($errors | Out-String)"
            }
          }
          Write-Host "Validated $($scripts.Count) PowerShell scripts with 0 syntax errors."

      - name: Cache OBS & FFmpeg SDK downloads
        uses: actions/cache@v4
        with:
          path: |
            vendor/obs-studio-32.1.2.zip
            vendor/OBS-Studio-32.1.2-Windows-x64.zip
            vendor/ffmpeg-8.0.1-full_build-shared.zip
          key: windows-sdk-deps-obs32.1.2-ffmpeg8.0.1

      - name: Configure and build plugin & helper (RelWithDebInfo)
        shell: pwsh
        run: .\scripts\configure-build.ps1 -Build -Configuration RelWithDebInfo

      - name: Run CTest unit test suite
        shell: pwsh
        run: ctest --test-dir build -C RelWithDebInfo --output-on-failure

      - name: Upload compiled plugin binaries
        uses: actions/upload-artifact@v4
        with:
          name: obs-scrcpy-source-windows-x64-ci
          path: |
            build/RelWithDebInfo/obs-scrcpy-source.dll
            build/RelWithDebInfo/obs-scrcpy-source.pdb
            build/RelWithDebInfo/obs-airplay-tether-helper.exe
            build/RelWithDebInfo/obs-airplay-tether-helper.pdb
            data/**
