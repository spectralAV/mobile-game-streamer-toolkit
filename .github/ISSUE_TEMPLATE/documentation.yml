name: Documentation issue
description: Report unclear, missing, stale, or incorrect documentation.
title: "[Docs]: "
labels:
  - documentation
body:
  - type: input
    id: page
    attributes:
      label: Page or file
      placeholder: "README.md, docs/installing-toolkit.md, docs/support.md, etc."
    validations:
      required: true
  - type: textarea
    id: issue
    attributes:
      label: What should change?
      description: Explain what is unclear, missing, stale, or incorrect.
    validations:
      required: true
  - type: textarea
    id: suggestion
    attributes:
      label: Suggested wording
      description: Optional. Paste proposed text if you have it.
