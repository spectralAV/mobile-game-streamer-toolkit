AirPlaySource.Help="How to connect: Check 'Enable AirPlay receiver' above. On iPhone/iPad, swipe down from the top-right corner to open Control Center (quick settings bar) -> tap Screen Mirroring (two overlapping rectangles) -> select 'OBS AirPlay' (Home-button iPhones: swipe up from bottom; Mac: Control Center in top-right menu bar). Wi-Fi mode: connect PC & device to the same 5 GHz network. USB Cable mode: unlock iPhone, tap Trust if prompted, check 'Enable iPhone USB Reverse Tethering' until USB Status is Active, then start Screen Mirroring from Control Center."
